[project]
name = "alano-cut"
version = "0.6.0"
description = "Local-first agentic rough-cut engine for Premiere-compatible timelines"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pillow",
    "numpy<2.0",
    "torch",
    "torchaudio",
    "deepfilternet",
    "onnxruntime-directml",
    "scipy<1.13",
    "scikit-learn<1.5",
    "huggingface-hub",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
